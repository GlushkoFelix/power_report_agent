<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <rect x="0" y="0" width="1280" height="820" fill="#F5F7FA"/>
  <text x="40" y="56" font-family="SimHei" font-size="20" fill="#1F2937">错误提示与异常态样式规范</text>
  <text x="40" y="80" font-family="SimHei" font-size="12" fill="#6B7280">原则：明确说清「什么错了 + 怎么改」，绝不静默失败，绝不编造结果</text>

  <!-- 1 表单内联校验 -->
  <text x="40" y="126" font-family="SimHei" font-size="13" fill="#1F2937">① 表单 / 上传内联校验（就地提示，红色描边 + 下方红字）</text>
  <rect x="40" y="140" width="560" height="120" rx="10" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="60" y="168" font-family="SimHei" font-size="11" fill="#1F2937">上传文件</text>
  <rect x="60" y="180" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E03131" stroke-width="2"/>
  <text x="74" y="202" font-family="SimHei" font-size="11" fill="#6B7280">用电数据_2021.csv</text>
  <text x="60" y="232" font-family="SimHei" font-size="11" fill="#E03131">⚠ E_NO_TIME_COLUMN：未识别到时间列。</text>
  <text x="60" y="250" font-family="SimHei" font-size="11" fill="#6B7280">请确保表头包含 Date/日期/时间戳 等列（示例：Date;Time;Global_active_power）。</text>

  <circle cx="588" cy="140" r="11" fill="#E03131"/>
  <text x="584" y="145" font-family="SimHei" font-size="12" fill="#FFFFFF">1</text>

  <!-- 2 卡片内执行失败 -->
  <text x="40" y="306" font-family="SimHei" font-size="13" fill="#1F2937">② 分析执行失败（对话气泡内的错误块，必须给出原因与下一步）</text>
  <rect x="40" y="320" width="560" height="190" rx="10" fill="#FFFFFF" stroke="#E03131"/>
  <text x="60" y="348" font-family="SimHei" font-size="11" fill="#E03131">✕ 分析未完成（E_SQL_EXEC）</text>
  <rect x="60" y="360" width="520" height="82" rx="6" fill="#FFF5F5"/>
  <text x="72" y="382" font-family="SimHei" font-size="11" fill="#1F2937">失败原因：no such column: peak_ratio_kwh</text>
  <text x="72" y="402" font-family="SimHei" font-size="11" fill="#1F2937">已尝试：SQL 路径 → 换 pandas 路径 → 仍失败（重试 2 次）</text>
  <text x="72" y="422" font-family="SimHei" font-size="11" fill="#6B7280">字段名可能不存在；本报表的时段占比字段为 peak_ratio（不是 peak_ratio_kwh）</text>
  <text x="72" y="438" font-family="SimHei" font-size="11" fill="#6B7280">本次未生成任何结果，系统不会给出推测数据</text>

  <rect x="60" y="452" width="88" height="28" rx="6" fill="#1D4ED8"/>
  <text x="76" y="471" font-family="SimHei" font-size="11" fill="#FFFFFF">重试</text>
  <rect x="156" y="452" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="168" y="471" font-family="SimHei" font-size="11" fill="#1F2937">查看生成代码</text>
  <rect x="284" y="452" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="296" y="471" font-family="SimHei" font-size="11" fill="#1F2937">查看字段字典</text>
  <rect x="432" y="452" width="148" height="28" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="444" y="471" font-family="SimHei" font-size="11" fill="#1F2937">复制错误信息</text>

  <circle cx="588" cy="320" r="11" fill="#E03131"/>
  <text x="584" y="325" font-family="SimHei" font-size="12" fill="#FFFFFF">2</text>

  <!-- 3 拒答样式 -->
  <text x="40" y="548" font-family="SimHei" font-size="13" fill="#1F2937">③ 拒答（超出报表范围，用中性灰而非红色，避免“报错”观感）</text>
  <rect x="40" y="562" width="560" height="150" rx="10" fill="#FFFFFF" stroke="#D9DEE7"/>
  <rect x="60" y="582" width="520" height="72" rx="6" fill="#F1F3F5"/>
  <text x="72" y="604" font-family="SimHei" font-size="11" fill="#1F2937">这个问题无法回答：当前报表不含「电价」字段。</text>
  <text x="72" y="624" font-family="SimHei" font-size="11" fill="#6B7280">本报表字段范围：电量（kWh）、功率（kW）、电压、电流、时段电量、结构占比。</text>
  <text x="72" y="644" font-family="SimHei" font-size="11" fill="#6B7280">你可以改为问：「全期总用电量是多少」「峰段电量占比多少」。</text>

  <rect x="60" y="664" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="72" y="684" font-family="SimHei" font-size="11" fill="#1F2937">全期总用电量是多少</text>
  <rect x="248" y="664" width="156" height="30" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="260" y="684" font-family="SimHei" font-size="11" fill="#1F2937">峰段电量占比多少</text>

  <circle cx="588" cy="562" r="11" fill="#E03131"/>
  <text x="584" y="567" font-family="SimHei" font-size="12" fill="#FFFFFF">3</text>

  <!-- 4 Toast -->
  <text x="640" y="126" font-family="SimHei" font-size="13" fill="#1F2937">④ 全局 Toast（鉴权 / 限流 / 网络类，右上角，4 秒自动消失）</text>
  <rect x="640" y="140" width="600" height="72" rx="8" fill="#FFFFFF" stroke="#E03131"/>
  <text x="660" y="168" font-family="SimHei" font-size="11" fill="#E03131">✕ E_AUTH：登录已过期，请重新登录</text>
  <text x="660" y="190" font-family="SimHei" font-size="11" fill="#6B7280">未保存的输入已保留在输入框中，登录后可继续发送</text>
  <rect x="1130" y="158" width="90" height="30" rx="6" fill="#1D4ED8"/>
  <text x="1152" y="178" font-family="SimHei" font-size="11" fill="#FFFFFF">去登录</text>

  <rect x="640" y="224" width="600" height="72" rx="8" fill="#FFFFFF" stroke="#E8590C"/>
  <text x="660" y="252" font-family="SimHei" font-size="11" fill="#E8590C">⚠ E_LLM：模型服务繁忙（429 限流），12 秒后自动重试</text>
  <text x="660" y="274" font-family="SimHei" font-size="11" fill="#6B7280">已自动退避重试 2/3 次 · request_id：req_20260915_0042</text>

  <rect x="640" y="308" width="600" height="72" rx="8" fill="#FFFFFF" stroke="#0CA678"/>
  <text x="660" y="336" font-family="SimHei" font-size="11" fill="#0CA678">✓ 报表已入库：我的用电报表.csv（365 行）</text>
  <text x="660" y="358" font-family="SimHei" font-size="11" fill="#6B7280">已生成 Schema 描述，可直接在对话中选择该报表提问</text>

  <circle cx="1248" cy="126" r="11" fill="#E03131"/>
  <text x="1244" y="131" font-family="SimHei" font-size="12" fill="#FFFFFF">4</text>

  <!-- 5 阻断式安全拦截 -->
  <text x="640" y="424" font-family="SimHei" font-size="13" fill="#1F2937">⑤ 安全拦截（危险请求被阻断，红色描边 + 说明已记录审计日志）</text>
  <rect x="640" y="438" width="600" height="126" rx="10" fill="#FFFFFF" stroke="#E03131" stroke-width="2"/>
  <text x="660" y="466" font-family="SimHei" font-size="11" fill="#E03131">⛔ 已拦截：请求包含不允许的操作</text>
  <rect x="660" y="478" width="560" height="30" rx="4" fill="#FFF5F5"/>
  <text x="672" y="498" font-family="SimHei" font-size="11" fill="#1F2937">DROP TABLE report_daily; -- 仅允许 SELECT 查询</text>
  <text x="660" y="528" font-family="SimHei" font-size="11" fill="#6B7280">规则：sqlglot:non_select · 动作：blocked · 已写入安全审计日志（audit_logs）</text>
  <text x="660" y="548" font-family="SimHei" font-size="11" fill="#6B7280">系统只提供只读数据分析能力，不支持删除或修改数据。</text>

  <circle cx="1248" cy="424" r="11" fill="#E03131"/>
  <text x="1244" y="429" font-family="SimHei" font-size="12" fill="#FFFFFF">5</text>

  <!-- 样式规范 -->
  <text x="640" y="616" font-family="SimHei" font-size="13" fill="#1F2937">样式与错误码映射</text>
  <rect x="640" y="628" width="600" height="28" fill="#F1F3F5"/>
  <text x="652" y="647" font-family="SimHei" font-size="11" fill="#6B7280">错误码</text>
  <text x="812" y="647" font-family="SimHei" font-size="11" fill="#6B7280">呈现形式</text>
  <text x="1012" y="647" font-family="SimHei" font-size="11" fill="#6B7280">主色</text>
  <text x="1122" y="647" font-family="SimHei" font-size="11" fill="#6B7280">可重试</text>

  <text x="652" y="676" font-family="SimHei" font-size="11" fill="#1F2937">E_NO_TIME_COLUMN / E_ENCODING</text>
  <text x="812" y="676" font-family="SimHei" font-size="11" fill="#1F2937">表单内联</text>
  <text x="1012" y="676" font-family="SimHei" font-size="11" fill="#E03131">红 #E03131</text>
  <text x="1122" y="676" font-family="SimHei" font-size="11" fill="#6B7280">改文件后重试</text>
  <line x1="640" y1="688" x2="1240" y2="688" stroke="#EEF1F5"/>

  <text x="652" y="708" font-family="SimHei" font-size="11" fill="#1F2937">E_SQL_FORBIDDEN / E_SANDBOX_TIMEOUT</text>
  <text x="812" y="708" font-family="SimHei" font-size="11" fill="#1F2937">卡片内错误块</text>
  <text x="1012" y="708" font-family="SimHei" font-size="11" fill="#E03131">红 #E03131</text>
  <text x="1122" y="708" font-family="SimHei" font-size="11" fill="#6B7280">是</text>
  <line x1="640" y1="720" x2="1240" y2="720" stroke="#EEF1F5"/>

  <text x="652" y="740" font-family="SimHei" font-size="11" fill="#1F2937">E_OUT_OF_SCOPE</text>
  <text x="812" y="740" font-family="SimHei" font-size="11" fill="#1F2937">拒答气泡 + 建议</text>
  <text x="1012" y="740" font-family="SimHei" font-size="11" fill="#6B7280">灰 #6B7280</text>
  <text x="1122" y="740" font-family="SimHei" font-size="11" fill="#6B7280">否</text>
  <line x1="640" y1="752" x2="1240" y2="752" stroke="#EEF1F5"/>

  <text x="652" y="772" font-family="SimHei" font-size="11" fill="#1F2937">E_AUTH / E_FORBIDDEN</text>
  <text x="812" y="772" font-family="SimHei" font-size="11" fill="#1F2937">Toast + 跳转</text>
  <text x="1012" y="772" font-family="SimHei" font-size="11" fill="#E03131">红 #E03131</text>
  <text x="1122" y="772" font-family="SimHei" font-size="11" fill="#6B7280">登录后重试</text>
  <line x1="640" y1="784" x2="1240" y2="784" stroke="#EEF1F5"/>

  <text x="652" y="804" font-family="SimHei" font-size="11" fill="#1F2937">E_LLM / 网络超时</text>
  <text x="812" y="804" font-family="SimHei" font-size="11" fill="#1F2937">Toast + 自动退避</text>
  <text x="1012" y="804" font-family="SimHei" font-size="11" fill="#E8590C">橙 #E8590C</text>
  <text x="1122" y="804" font-family="SimHei" font-size="11" fill="#6B7280">自动</text>
</svg>
