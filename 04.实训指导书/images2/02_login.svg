<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect x="0" y="0" width="1440" height="900" fill="#F5F7FA"/>

  <!-- 左：品牌区 -->
  <rect x="0" y="0" width="720" height="900" fill="#1D4ED8"/>
  <rect x="72" y="300" width="36" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="82" y="326" font-family="SimHei" font-size="20" fill="#FFFFFF">⚡</text>
  <text x="72" y="392" font-family="SimHei" font-size="34" fill="#FFFFFF">智电析报</text>
  <text x="72" y="428" font-family="SimHei" font-size="15" fill="#DCE6FF">基于LLM的能源电力报表智能分析Agent</text>

  <text x="72" y="500" font-family="SimHei" font-size="13" fill="#FFFFFF">上传用电报表，用自然语言完成统计、绘图与异常解读</text>
  <rect x="72" y="524" width="6" height="6" rx="3" fill="#FFFFFF"/>
  <text x="90" y="532" font-family="SimHei" font-size="13" fill="#DCE6FF">自然语言转 SQL / pandas 代码，受控沙箱执行</text>
  <rect x="72" y="556" width="6" height="6" rx="3" fill="#FFFFFF"/>
  <text x="90" y="564" font-family="SimHei" font-size="13" fill="#DCE6FF">内置电力报表口径规范，杜绝量纲与拆分混算</text>
  <rect x="72" y="588" width="6" height="6" rx="3" fill="#FFFFFF"/>
  <text x="90" y="596" font-family="SimHei" font-size="13" fill="#DCE6FF">图表与数据表联动，支持图片导出</text>

  <text x="72" y="836" font-family="SimHei" font-size="11" fill="#A9C0FF">数据来源：UCI Machine Learning Repository #235（公开数据集）</text>

  <!-- 右：登录卡片 -->
  <rect x="800" y="196" width="480" height="508" rx="12" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="840" y="256" font-family="SimHei" font-size="22" fill="#1F2937">登录</text>
  <text x="840" y="282" font-family="SimHei" font-size="12" fill="#6B7280">使用账号登录后即可上传报表并开始分析</text>

  <text x="840" y="330" font-family="SimHei" font-size="12" fill="#1F2937">用户名</text>
  <rect x="840" y="342" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="854" y="367" font-family="SimHei" font-size="12" fill="#ADB5BD">请输入 4-20 位用户名</text>

  <text x="840" y="410" font-family="SimHei" font-size="12" fill="#1F2937">密码</text>
  <rect x="840" y="422" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="854" y="447" font-family="SimHei" font-size="12" fill="#ADB5BD">请输入密码（≥8 位，含字母与数字）</text>
  <text x="1204" y="447" font-family="SimHei" font-size="11" fill="#6B7280">显示</text>

  <!-- 错误态示例 -->
  <rect x="840" y="474" width="400" height="18" rx="3" fill="#FFF5F5"/>
  <text x="840" y="488" font-family="SimHei" font-size="11" fill="#E03131">⚠ 用户名或密码错误，连续失败 5 次将锁定 5 分钟</text>

  <rect x="840" y="506" width="400" height="44" rx="8" fill="#1D4ED8"/>
  <text x="1016" y="534" font-family="SimHei" font-size="15" fill="#FFFFFF">登 录</text>

  <text x="840" y="578" font-family="SimHei" font-size="12" fill="#6B7280">还没有账号？</text>
  <text x="928" y="578" font-family="SimHei" font-size="12" fill="#1D4ED8">立即注册</text>

  <line x1="840" y1="608" x2="1240" y2="608" stroke="#EEF1F5"/>
  <text x="840" y="632" font-family="SimHei" font-size="11" fill="#6B7280">分析结论仅供参考，不作为用电调度、电费结算与投资决策的直接依据</text>
  <text x="840" y="652" font-family="SimHei" font-size="11" fill="#6B7280">用户上传数据按账号隔离存储，本机部署不对外传输</text>

  <!-- 注册态切换示意 -->
  <rect x="840" y="672" width="400" height="1" fill="#FFFFFF"/>
  <text x="840" y="692" font-family="SimHei" font-size="11" fill="#ADB5BD">（切换到「注册」页时：增加“确认密码”输入框与密码强度提示）</text>

  <!-- 标注 -->
  <circle cx="1296" cy="212" r="11" fill="#E03131"/>
  <text x="1292" y="217" font-family="SimHei" font-size="12" fill="#FFFFFF">1</text>
  <circle cx="828" cy="346" r="11" fill="#E03131"/>
  <text x="824" y="351" font-family="SimHei" font-size="12" fill="#FFFFFF">2</text>
  <circle cx="828" y="478" r="11" fill="#E03131"/>
  <text x="824" y="483" font-family="SimHei" font-size="12" fill="#FFFFFF">3</text>
</svg>
