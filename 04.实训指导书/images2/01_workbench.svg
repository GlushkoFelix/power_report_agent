  <!-- SQL 折叠块 -->
  <rect x="272" y="276" width="712" height="64" rx="6" fill="#F8FAFC" stroke="#D9DEE7"/>
  <text x="284" y="294" font-family="SimHei" font-size="11" fill="#6B7280">▾ 已执行的 SQL（点击可展开/复制）</text>
  <text x="284" y="314" font-family="SimHei" font-size="11" fill="#1F2937">SELECT year_month, SUM(consumption_kwh) AS total_kwh FROM report_daily</text>
  <text x="284" y="330" font-family="SimHei" font-size="11" fill="#1F2937">WHERE is_weekend = 1 AND is_partial_period = 0 GROUP BY year_month ORDER BY year_month;</text>

